<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slots and Shadow DOM</title>
</head>
<body>

  <script type="module">
    import { shadow } from './short.js';

    function btn() {
        return "<button onclick=\"alert('Button clicked!')\">Click Me</button>"
    }

    function txt(text) {
      return (
        "<h1 id='short-title'>" + text + "</h1>" 
      )
    }

    function component() {
        return (
            txt("Short 1") + btn() + txt("Short 2")
        )
    }   

    shadow(component())
  </script>
</body>
</html>
