<html><head>
    <meta charset="UTF-8">
    <title>Counter Demo</title>
    <link href="../app.css" rel="stylesheet">
</head>

<body class="bg-linear-to-br from-indigo-100 to-purple-100 min-h-screen flex items-center justify-center">
    
        <div class="ct-card">
            <h2 class="ct-title">Counter</h2>
            <p class="ct-value"><span data-st="count">0</span></p>
            <div class="ct-btn-group">
                <button class="ct-btn ct-btn-dec" onclick="window['st:801qan:count'] -= 1">−</button>
                <button class="ct-btn ct-btn-inc" onclick="window['st:801qan:count'] += 1">+</button>
                <button class="ct-btn ct-btn-reset" onclick="window['st:801qan:count'] = 0">Reset</button>
            </div>
        </div>

    



</body></html>
