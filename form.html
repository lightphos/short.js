<body>
    <form class="frm-sh">
        <h2 class="hdr-sh">Sign In</h2>
        <p><label>Username <input type="text"  placeholder = "username" /></label></p>
        <p><label>Password <input type="password"  placeholder = "password" /></label></p>
        <button type="submit" onClick="/" class="btn-sh">submit</button>
    <!-- <p>${sh.lnk({ref:"/pg/signup", txt:"sign up"})}</p> -->
    </form>
    <form class="frm-sh">
        <h2 class="hdr-sh">Sign Up</h2>
        <p><label>Username <input type="text"  placeholder = "username" /></label></p>
        <p><label>Password <input type="password"  placeholder = "password" /></label></p>
        <p><label>Confirm <input type="password"  placeholder = "password" /></label></p>
        <button type="submit" onClick="/" class="btn-sh">submit</button>
    <!-- <p>${sh.lnk({ref:"/pg/signup", txt:"sign up"})}</p> -->
    </form>
