<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slots and Shadow DOM</title>
</head>
<body>

  <script type="module">
    import * as sh  from '../short.js';
    import { header } from './pg/header.js';

    function component() {
        return (
            header({ txt: "Short.JS" }) +
            
            sh.txt("<h1>Short 1</h1>") + 
            sh.btn({txt:"Click", clk:"alert('click')"}) + 
            sh.txt("<h2>Short 2</h2>")
        )
    }   

    sh.sfix(component(), './slots.css')
  </script>
</body>
</html>
